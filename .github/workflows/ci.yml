name: CI and container release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

concurrency:
  group: kokoro-nova-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/lordfoxfairy/kokoro-nova
  NODE_VERSION: '22'
  PNPM_VERSION: '11.2.2'

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit and contract tests
        run: pnpm test

      - name: Static container delivery contract
        run: node --test scripts/container-contract.test.mjs

      - name: Production build
        run: pnpm build

  e2e:
    name: Browser interaction suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Run isolated browser interaction suite
        run: pnpm e2e:ci

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  visual-regression:
    name: Visual regression (macOS 1440x900)
    runs-on: macos-14
    timeout-minutes: 45
    env:
      E2E_PORT: '3220'
      E2E_DATA_DIR: .data-e2e-visual
      E2E_NEXT_DIST_DIR: .next-e2e-visual
      REGRESSION_BASE_URL: http://127.0.0.1:3220
      PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report
      PLAYWRIGHT_HTML_OPEN: never

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Chromium
        run: pnpm exec playwright install chromium

      - name: Record visual platform contract
        run: |
          set +e
          mkdir -p test-results/visual-platform
          {
            echo '=== runner ==='
            sw_vers
            uname -a
            echo '=== playwright ==='
            pnpm exec playwright --version
            echo '=== chromium ==='
            node --input-type=module -e "import { chromium } from 'playwright'; import { execFileSync } from 'node:child_process'; const executable = chromium.executablePath(); console.log(executable); console.log(execFileSync(executable, ['--version'], { encoding: 'utf8' }));"
            echo '=== installed font families ==='
            system_profiler SPFontsDataType || true
          } > test-results/visual-platform/platform.txt

      - name: Compare approved 1440x900 visual baselines
        run: pnpm e2e:visual

      - name: Upload visual diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-${{ github.run_id }}
          path: |
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish GHCR image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify, e2e, visual-regression]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
            type=sha,format=long
          labels: |
            org.opencontainers.image.source=https://github.com/LordFoxFairy/kokoro-nova

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=kokoro-nova
          cache-to: type=gha,mode=max,scope=kokoro-nova
