      "description": "节点、边、分组与视口 mutation"
    },
    {
      "name": "Jobs",
      "description": "生成任务状态机"
    },
    {
      "name": "Models",
      "description": "版本化模型目录与能力矩阵"
    },
    {
      "name": "Video",
      "description": "视频合成与导出"
    },
    {
      "name": "Assets",
      "description": "上传、资产与本地媒体"
    },
    {
