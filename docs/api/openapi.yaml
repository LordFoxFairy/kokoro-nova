{
  "openapi": "3.1.0",
  "info": {
    "title": "LibTV Frontend Replica Mock API",
    "version": "1.25.1-account-member-not-found",
    "description": "Frontend-only LibTV replica contract backed by a deterministic local mock. It never reads real LibTV credentials and never calls the LibTV backend; official observations are sanitized evidence only."
  },
  "servers": [
    {
      "url": "http://localhost:3200",
      "description": "Next.js 本地 mock server"
    }
  ],
  "tags": [
    {
      "name": "Projects",
      "description": "项目列表与生命周期"
    },
    {
      "name": "Recycle Bin",
      "description": "项目软删除、30 天保留、恢复与永久清理"
    },
    {
      "name": "Folders",
      "description": "项目文件夹"
    },
    {
      "name": "Canvases",
      "description": "多画布"
    },
    {
      "name": "Workflow",
      "description": "节点、边、分组与视口 mutation"
    },
    {
      "name": "Jobs",
      "description": "生成任务状态机"
    },
    {
      "name": "Models",
      "description": "版本化模型目录与能力矩阵"
    },
    {
      "name": "Video",
      "description": "视频合成与导出"
    },
    {
      "name": "Assets",
      "description": "上传、资产与本地媒体"
    },
    {
      "name": "Agent",
      "description": "会话、固定版本 Skill、确定性工具轨迹与 mutation 确认门"
    },
    {
      "name": "Skills",
      "description": "Skill 市场"
    },
    {
      "name": "Publish",
      "description": "TV Show 与公开快照"
    },
    {
      "name": "Ledger",
      "description": "积分余额与明细"
    },
    {
      "name": "Presence",
      "description": "编辑租约、协作光标和跟随"
    },
    {
      "name": "Development",
      "description": "确定性 fixture 控制"
    },
    {
      "name": "Script V2",
      "description": "三阶段脚本、资产与双轨提示词的 frontend-only local mock；不调用真实 LibTV 后端。"
    },
    {
      "name": "Account",
      "description": "共享身份、钱包、偏好与通知"
    },
    {
      "name": "Materials",
      "description": "风格与特效独立素材目录"
