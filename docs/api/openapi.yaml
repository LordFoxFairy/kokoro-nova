  "paths": {
    "/api/agent/sessions/{sessionId}/messages": {
      "post": {
        "tags": [
          "Agent"
        ],
        "summary": "固定 Skill 并生成确定性 Agent 计划",
        "operationId": "sendAgentMessage",
        "x-ui-triggers": [
          "Agent 输入框发送消息并固定已选 Skill"
        ],
        "x-mock-scenarios": [
          "authenticated-populated"
        ],
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AgentMessagesResponse"
                },
                "examples": {
                  "fixture": {
                    "$ref": "#/components/examples/AgentMessagesResponseExample"
                  },
                  "skillExecution": {
                    "$ref": "#/components/examples/AgentSkillExecutionResponseExample"
                  }
                }
              }
            }
          },
          "400": {
            "description": "消息不能为空",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "404": {
            "description": "会话不存在",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "500": {
            "description": "请求 JSON 或本地 Agent 执行失败",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "sessionId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 200
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/SendAgentMessageRequest"
              }
            }
          }
        },
        "description": "本地 deterministic runner 生成 text/media mutation proposal 与 skills.resolve、workflow.plan tool trace；不调用真实 LLM。",
        "x-authorization": "owner",
        "security": [
          {
            "bearerAuth": []
          }
        ]
      },
      "patch": {
        "tags": [
          "Agent"
        ],
        "summary": "回答 Agent 询问或确认确定性工作流",
        "operationId": "resolveAgentMessage",
        "x-ui-triggers": [
          "回答 ask_human",
          "确认或拒绝 mutation proposal，并展示本地运行/失败降级"
        ],
        "x-mock-scenarios": [
          "authenticated-populated"
        ],
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AgentMessagesResponse"
                },
                "examples": {
                  "fixture": {
                    "$ref": "#/components/examples/AgentMessagesResponseExample"
                  },
                  "skillExecution": {
                    "$ref": "#/components/examples/AgentSkillExecutionResponseExample"
                  }
                }
              }
            }
          },
          "400": {
            "description": "回答不能为空或会话没有绑定画布",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "404": {
            "description": "会话或消息不存在",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "500": {
            "description": "请求 JSON 或本地 Agent 执行失败",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "sessionId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 200
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ResolveAgentMessageRequest"
              }
            }
          }
        },
        "description": "apply 通过 canonical mutation reducer 写入画布；媒体失败 marker 只产生本地 fallback trace，不创建远程任务或消费积分。",
        "x-authorization": "owner",
        "security": [
          {
            "bearerAuth": []
          }
        ]
      }
    },
