    },
    {
      "name": "Development",
      "description": "确定性 fixture 控制"
    },
    {
      "name": "Script V2",
      "description": "三阶段脚本、资产与双轨提示词的 frontend-only local mock；不调用真实 LibTV 后端。"
    }
